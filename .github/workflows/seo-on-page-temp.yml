name: Temporary SEO metadata update
on:
  push:
    branches: [seo/on-page]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply SEO metadata') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<meta name="description" content="Full Stack Developer based in Dhaka, Bangladesh. 6+ years building scalable web applications with React, Node.js, and modern cloud infrastructure."/>', '<meta name="description" content="Full Stack Developer in Dhaka, Bangladesh specializing in React, Next.js, Node.js, TypeScript, PostgreSQL, APIs, AWS, and scalable web applications."/>'),
              ('<meta property="og:url" content="https://farukislam.dev"/>', '<meta property="og:url" content="https://farukislamyt.github.io/"/>'),
              ('<meta property="og:image" content="assets/og-image.png"/>', '<meta property="og:image" content="https://farukislamyt.github.io/assets/og-image.png"/>'),
              ('<meta name="author" content="Faruk Islam"/>', '<meta name="author" content="Faruk Islam"/>\n  <meta name="robots" content="index,follow,max-image-preview:large"/>\n  <link rel="canonical" href="https://farukislamyt.github.io/"/>'),
              ('"url":"https://farukislam.dev"', '"url":"https://farukislamyt.github.io/"'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit SEO metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore: apply SEO metadata"
          git push
